# cargo-deny configuration for auspex
# Run via `just deny` or as part of `just ci`

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
ignore = [
    # Add known false-positive advisories here when they appear
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # Prefer the non-deprecated versions of these
    { name = "openssl" , use-instead = "rustls"},
    { name = "openssl-sys", use-instead = "rustls" },
    "libssh2-sys",
    # rustls's default crypto provider drags in a cmake-built C library
    # (aws-lc-sys); our default feature set compiles rustls with ring instead.
    # cargo-deny resolves the default-feature graph, so these bans guard that
    # default. The `aws-lc-rs` cargo feature is the sanctioned opt-in — a deny
    # run with --all-features is expected to fail (ban + OpenSSL license).
    { name = "aws-lc-rs", use-instead = "ring" },
    { name = "aws-lc-sys", use-instead = "ring" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "ISC",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "CC0-1.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CDLA-Permissive-2.0"
]
confidence-threshold = 0.9
unused-allowed-license = "allow"
