name: "Tests"
on:
    push:
        branches: ["latest"]
        paths:
            - src/**
            - Cargo.toml
            - Cargo.lock
            - .github/workflows/test.yaml
    pull_request:
        branches: ["latest"]
    workflow_dispatch:
permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always

jobs:
    test:
        name: test
        runs-on: ubuntu-latest
        strategy:
            matrix:
                rust: [stable, "1.90"]
            fail-fast: false
        env:
            SCCACHE_GHA_ENABLED: "true"
            RUSTC_WRAPPER: "sccache"
        steps:
            - name: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: sccache-cache
              uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

            - name: Install Rust toolchain
              uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17
              with:
                  toolchain: ${{ matrix.rust }}
                  components: clippy
                  cache-directories: |
                      ~/.cargo/registry
                      ~/.cargo/bin
                      target

            - name: Install cargo-nextest
              shell: bash
              run: |
                  if [[ -z $(which cargo-nextest) ]]; then
                    curl -sL https://get.nexte.st/latest/linux -o nextest.tgz
                    tar xfz nextest.tgz
                    mv cargo-nextest /home/runner/.cargo/bin
                  fi

            # The aws-lc bans left deny.toml when the `aws-lc-rs` feature
            # arrived (CI deny runs --all-features, which would always trip
            # them), so this assertion is now what guards the invariant: the
            # default graph compiles no cmake-built C library. It catches a
            # future reqwest/rustls bump quietly re-adding aws-lc.
            - name: default graph stays ring-only
              shell: bash
              run: "! cargo tree -i aws-lc-sys"

            - name: run all tests
              shell: bash
              run: |
                cargo nextest run --workspace --lib --bins --tests --examples --future-incompat-report
                cargo nextest run --workspace --lib --tests --features axum --future-incompat-report

            - name: Run doctests
              run: cargo test --doc

            # `--no-default-features` is load-bearing: it exercises the graph
            # where ring does not exist at all, so passing tests prove aws-lc-rs
            # is the installed runtime provider.
            - name: test aws-lc-rs provider
              if: ${{ matrix.rust == 'stable' }}
              run: cargo nextest run --workspace --lib --tests --no-default-features --features aws-lc-rs,axum --future-incompat-report

            # Lint policy and MSRV compatibility are separate concerns.
            - name: consult Clippy (strict)
              if: ${{ matrix.rust == 'stable' }}
              shell: bash
              run: |
                cargo clippy --workspace --all-targets -- -D warnings
                cargo clippy --workspace --all-targets --features axum -- -D warnings
                cargo clippy --workspace --lib --tests --no-default-features --features aws-lc-rs,axum -- -D warnings

    deny:
        name: cargo-deny
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false
            - name: cargo-deny
              uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

    fmt:
        name: formatting check
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: Install nightly Rust
              uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17
              with:
                  toolchain: nightly
                  components: rustfmt

            - name: check formatting
              run: cargo +nightly fmt --check --all
